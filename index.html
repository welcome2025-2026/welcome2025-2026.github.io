<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty of Computing &amp; Technology - Redirecting...</title>

  <!-- Prevent mobile & browser caching so future destination changes take effect immediately -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- =========================================================================
       PERMANENT REDIRECT TARGET CONFIGURATION
       To change where this QR code points in the future, simply edit the URL below:
       ========================================================================= -->
  <script>
    var TARGET_URL = "https://welcome2025-2026.netlify.app";

    // Instant redirect preserving query parameters (e.g. ?ref=banner) and hash
    window.location.replace(TARGET_URL + window.location.search + window.location.hash);
  </script>

  <!-- Fallback meta refresh for devices with JavaScript disabled -->
  <meta http-equiv="refresh" content="0;url=https://welcome2025-2026.netlify.app">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f8fafc;
      text-align: center;
      padding: 24px;
    }
    .redirect-card {
      background: #111728;
      border: 1px solid #1c253b;
      border-top: 4px solid #D4AF37;
      padding: 36px 28px;
      border-radius: 18px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }
    .faculty-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #D4AF37;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 10px;
      color: #ffffff;
      line-height: 1.35;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .btn-redirect {
      display: inline-block;
      background: #660000;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      border: 1px solid #D4AF37;
      transition: background 0.2s ease;
    }
    .btn-redirect:hover {
      background: #800000;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="faculty-badge">University of Kelaniya</div>
    <h1>Faculty of Computing &amp; Technology</h1>
    <p>Redirecting to the Freshers Induction &amp; Welcome Portal...</p>
    <a id="fallback-btn" class="btn-redirect" href="https://welcome2025-2026.netlify.app">
      Click here if not redirected
    </a>
  </div>
</body>
</html>
